name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (used in -ldflags). Leave blank for git-describe.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Tags drive the stable version (v1.2.3 → 1.2.3). Branch builds get a
      # describe-based dev version so every commit yields a unique filename.
      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//')-${GITHUB_REF##*/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/lh-agent-windows-amd64.exe" \
            ./cmd/agent
          # Versioned copy alongside the stable filename — installers grab
          # the stable URL (latest/download/lh-agent-windows-amd64.exe);
          # the versioned asset is for bisecting / supporting an old client.
          cp "dist/lh-agent-windows-amd64.exe" "dist/lh-agent-${VERSION}-windows-amd64.exe"

      - name: Stage installer scripts as release assets
        run: |
          cp scripts/install.ps1   dist/install.ps1
          cp scripts/uninstall.ps1 dist/uninstall.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lh-agent-windows-amd64
          path: dist/*
          retention-days: 14

      # Real GitHub Release only on tag pushes — workflow_dispatch builds
      # stay as artifacts so we don't pollute the Releases page.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            dist/lh-agent-windows-amd64.exe
            dist/lh-agent-*-windows-amd64.exe
            dist/install.ps1
            dist/uninstall.ps1
          generate_release_notes: true
