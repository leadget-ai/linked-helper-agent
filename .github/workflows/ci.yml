name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Pure Go (modernc sqlite driver, no CGO) — no system packages needed.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
